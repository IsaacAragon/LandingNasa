<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Aresmap · The map for the first step on Mars | Gale Crater</title>
    <meta name="description" content="Aresmap combines seven data layers from Curiosity, MRO and NASA into one view to plan the first human walk in Gale crater, from Bradbury Landing to the boxwork on Mount Sharp. NASA Space Apps Challenge." />
    <link rel="canonical" href="https://aresmap.dev/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="author" content="Team Salomonsters" />

    <!-- Al compartir en redes (Open Graph y X/Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aresmap" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:url" content="https://aresmap.dev/" />
    <meta property="og:title" content="Aresmap · The map for the first step on Mars" />
    <meta property="og:description" content="Seven NASA data layers to plan the first human walk in Gale crater. NASA Space Apps Challenge." />
    <meta property="og:image" content="https://aresmap.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Aresmap logo on a dark background with the text: The map for the first step on Mars, Gale crater." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aresmap · The map for the first step on Mars" />
    <meta name="twitter:description" content="Seven NASA data layers to plan the first human walk in Gale crater." />
    <meta name="twitter:image" content="https://aresmap.dev/og-image.png" />

    <!-- Datos estructurados (schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Aresmap",
        "url": "https://aresmap.dev/",
        
        "description": "Layered map of Gale crater on Mars with data from Curiosity, MRO and NASA to plan an astronaut walk. NASA Space Apps Challenge project.", "inLanguage": ["en", "es"],
        "about": { "@type": "Place", "name": "Cráter Gale, Marte", "geo": { "@type": "GeoCoordinates", "latitude": -5.4, "longitude": 137.8 } }
      }
    </script>

    <!-- Fuente monoespaciada: se conecta antes y se carga sin bloquear el primer render -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" media="print" onload="this.media='all'" />

    <!-- Íconos -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#090808" />

    <!-- Sin JavaScript (o mientras carga) el contenido igual se ve: se oculta la intro en video -->
    <noscript>
      <style>
        .intro, .planet-layer, .stars { display: none !important; }
        .site[data-state="intro"] :is(.topbar, .hero-copy > *, .hud-card) { opacity: 1 !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
